[package]
name = "rust-dbviewer"
version = "0.1.0"
edition = "2021"
description = "Native Rust MySQL/MariaDB database viewer inspired by Beekeeper Studio"

[lib]
name = "rust_dbviewer"
path = "src/lib.rs"

[[bin]]
name = "rust-dbviewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "bigdecimal", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
dirs = "5"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
